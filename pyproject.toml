[project]
name = "egx-diligence-engine"
version = "0.1.0"
description = "Extract Egyptian company financial statements with provenance and analyse devaluation exposure"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",   # text layer, tables; bundles pypdfium2 for page rendering
    "pytesseract>=0.3",   # free local OCR for scanned pages (needs the tesseract binary)
    "openpyxl>=3.1",
    "certifi",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
ocr-mac = ["ocrmac>=1.0"]   # Apple Vision OCR via pyobjc: free, local, English only on macOS 14
dev = ["pytest>=8"]

[project.scripts]
efe = "efe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
efe = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
